document.addEventListener('contextmenu', function(e) {
    e.preventDefault();

// 2. منع اختصارات لوحة المفاتيح الخاصة بالمطورين وعرض الكود المصدري
document.addEventListener('keydown', function(e) {
    // F12 (أدوات المطور)
    if (e.keyCode === 123) {
        e.preventDefault();
        return false;
    }
    // Ctrl+Shift+I (Inspect) أو Ctrl+Shift+J (Console) أو Ctrl+Shift+C (Inspect Element)
    if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
        e.preventDefault();
        return false;
    }
    // Ctrl+U (View Source) أو Ctrl+S (Save Page) أو Ctrl+P (Print)
    if (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 80)) {
        e.preventDefault();
        return false;
    }
    // لأجهزة Mac (Command+Option+I / Command+Option+U)
    if (e.metaKey && e.altKey && (e.keyCode === 73 || e.keyCode === 85)) {
        e.preventDefault();
        return false;
    }
}, false);
