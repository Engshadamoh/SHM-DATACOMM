    <main class="max-w-7xl mx-auto px-4 py-8 space-y-10">
        <section>
            <div class="flex items-center gap-3 mb-6">

                <h2 class="text-2xl font-bold text-slate-800">1. عائلة معايير IEEE 802 (نطاق العمل)</h2>
            </div>
            
            <div class="bg-amber-50 border-r-4 border-amber-500 p-4 rounded-lg mb-6 flex gap-3 text-amber-900 text-sm md:text-base font-medium shadow-sm">
                <i class="fas fa-info-circle text-xl shrink-0 mt-0.5"></i>
                <p>
                    <strong>ملاحظة هامة:</strong> تركز مؤسسة IEEE في المشروع 802 على الشبكات المحلية (LAN) والشبكات الشخصية (PAN) والحضرية (MAN). أما <strong>الشبكات الواسعة (WAN)</strong> فتعتمد غالباً على معايير وبروتوكولات أخرى (مثل PPP, HDLC, Frame Relay) تديرها منظمات مثل ITU-T ولا تقع ضمن معايير IEEE 802، إلا في حالات الربط المحلي لها.
                </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass-panel p-6 rounded-2xl border-t-4 border-t-blue-500 hover:-translate-y-1 transition-transform">
                    <div class="w-14 h-14 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-2xl mb-4 shadow-sm">
                        <i class="fas fa-network-wired"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">IEEE 802.3</h3>
                    <p class="text-slate-600 font-medium mb-3">الشبكات المحلية السلكية (Wired LAN)</p>
                    <p class="text-sm text-slate-500">يُعرف تجارياً باسم <strong>Ethernet</strong>. وهو المعيار المهيمن عالمياً لربط الأجهزة عبر الكابلات النحاسية والألياف الضوئية.</p>
                </div>

                <div class="glass-panel p-6 rounded-2xl border-t-4 border-t-emerald-500 hover:-translate-y-1 transition-transform">
                    <div class="w-14 h-14 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600 text-2xl mb-4 shadow-sm">
                        <i class="fas fa-wifi"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">IEEE 802.11</h3>
                    <p class="text-slate-600 font-medium mb-3">الشبكات المحلية اللاسلكية (Wireless LAN)</p>
                    <p class="text-sm text-slate-500">يُعرف تجارياً باسم <strong>Wi-Fi</strong>. يحدد قواعد الاتصال اللاسلكي والترددات (مثل 2.4GHz و 5GHz) لنقل البيانات في نطاق محلي.</p>
                </div>

                <div class="glass-panel p-6 rounded-2xl border-t-4 border-t-indigo-500 hover:-translate-y-1 transition-transform">
                    <div class="w-14 h-14 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 text-2xl mb-4 shadow-sm">
                        <i class="fab fa-bluetooth-b"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">IEEE 802.15</h3>
                    <p class="text-slate-600 font-medium mb-3">الشبكات الشخصية اللاسلكية (Wireless PAN)</p>
                    <p class="text-sm text-slate-500">يشمل معايير مثل <strong>Bluetooth</strong> و <strong>Zigbee</strong>. مخصص للاتصالات قصيرة المدى جداً وذات استهلاك الطاقة المنخفض.</p>
                </div>
            </div>
        </section>

        <section>

                        <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>

                        <div class="text-lg font-bold font-mono z-10 tracking-wider">IEEE 802.3</div>

                    </div>
                </div>
                <div class="w-full md:w-2/3 space-y-4">
                    <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-slate-200 pb-2 inline-block">ما هو الإيثرنت (IEEE 802.3)؟</h2>
                    <p class="text-slate-700 leading-relaxed text-lg">
                        يُخطئ الكثيرون باعتبار "الإيثرنت" مجرد بروتوكول واحد. في الواقع، هندسياً، الإيثرنت هو <strong>معيار ضخم (Standard)</strong> يشمل تحته عائلة كاملة من البروتوكولات والتقنيات.
                    </p>
                    <ul class="list-disc list-inside text-slate-600 space-y-2 font-medium">
                        <li>يعمل هذا المعيار في الطبقة الأولى (Physical) لوصف أنواع الكابلات والإشارات الكهربائية/الضوئية.</li>
                        <li>يعمل أيضاً في الطبقة الفرعية (MAC Sublayer) من الطبقة الثانية لوصف كيفية عنونة الأجهزة (MAC Address) وبناء الإطار (Framing).</li>
                        <li>تطور المعيار بمرور الزمن ليدعم سرعات متزايدة تناسب متطلبات العصر الحديث.</li>
                    </ul>
                </div>
            </div>
        </section>

        <section class="mb-12">

                <div class="bg-slate-900 rounded-xl p-4 mb-8 text-center text-white min-h-[100px] flex flex-col justify-center shadow-inner">

                    <button onclick="fireAnimation(1.0, 'Fast Ethernet (100 Mbps)', 'معيار IEEE 802.3u | ثورة التسعينات، يستخدم كابلات UTP (Cat5).', 'bg-blue-600', 'hover:bg-blue-700')" 
                            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md transform hover:-translate-y-1">

                    <button onclick="fireAnimation(0.3, 'Gigabit Ethernet (1 Gbps)', 'معيار IEEE 802.3z (Fiber) / 802.3ab (Copper) | المعيار الشائع اليوم للشبكات المحلية (Cat5e/Cat6).', 'bg-amber-500', 'hover:bg-amber-600')"

    <script>
        const packet = document.getElementById('simulation-packet');

        const simDesc = document.getElementById('sim-desc');
        const simTime = document.getElementById('sim-time');
        
        let timeoutId = null;

        function fireAnimation(durationInSeconds, title, desc, bgColorClass, hoverColorClass) {

            packet.style.transition = 'none';
            packet.style.right = '10px';
            
            packet.className = 'packet-runner';
            
            if(durationInSeconds <= 0.1) {
                packet.classList.add('xgiga-trail');
                packet.style.background = 'linear-gradient(135deg, #e11d48, #be123c)';
            } else if (durationInSeconds <= 0.4) {
                packet.classList.add('giga-trail');
                packet.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
            } else if (durationInSeconds <= 1.0) {
                packet.classList.add('fast-trail');
                packet.style.background = 'linear-gradient(135deg, #2563eb, #1d4ed8)';
            } else {
                packet.style.background = 'linear-gradient(135deg, #475569, #334155)';
            }

            void packet.offsetWidth;

            packet.style.transition = `right ${durationInSeconds}s cubic-bezier(0.25, 0.1, 0.25, 1.0)`;
            packet.style.right = 'calc(100% - 60px)';

            timeoutId = setTimeout(() => {
                simTime.textContent = `تم وصول البيانات بنجاح في وقت قياسي لمحاكاة السرعة (${durationInSeconds} ثانية) ✅`;
                simTime.className = "text-emerald-400 font-bold text-sm bg-slate-800 inline-block mx-auto px-4 py-1 rounded-full border border-slate-700";
                
                packet.classList.remove('fast-trail', 'giga-trail', 'xgiga-trail');
            }, durationInSeconds * 1000);
        }
    </script>
</body>
</html>
